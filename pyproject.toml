[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-workshop-retail"
version = "1.0.0"
description = "Retail Pulse: Omnichannel Order, Inventory Sync & Commercial Margin/Vendor Contract Intelligence Platform (Google Antigravity Workshop)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "mcp>=1.2.0",
    "google-adk>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
